workflows:
  android-workflow:
    name: Android APK & App Bundle Build (Mobile Store)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          npm run build
      - name: Setup Capacitor Android
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug || ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - wryaomer996@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS App Build (Mobile Store)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          npm run build
      - name: Setup Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS App
        script: |
          cd ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build || true
    artifacts:
      - build/Build/Products/Debug-iphoneos/*.app
      - build/Build/Products/Debug-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - wryaomer996@gmail.com
        notify:
          success: true
          failure: true
